<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Await API Methods</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Async and Await API Methods</h1>
        <p>Try GET, POST, PUT, and DELETE with sample product data.</p>

        <label for="productTitle">Product title</label>
        <input id="productTitle" type="text" value="New Keyboard">

        <label for="productPrice">Price</label>
        <input id="productPrice" type="number" value="25">

        <div class="button-row">
            <button id="getButton">GET Product</button>
            <button id="postButton">POST Product</button>
            <button id="putButton">PUT Product</button>
            <button id="deleteButton">DELETE Product</button>
        </div>

        <p id="message">Choose an API method.</p>
        <pre id="result"></pre>
    </main>

    <script src="async-await-methods.js"></script>
</body>
</html>
