<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - Colors Backgrounds Borders</title>
    <script src="../../Day2/Code/tailwind.js"></script>
</head>
<body class="bg-white p-8 text-slate-950">
    <main class="grid max-w-xl grid-cols-3 gap-5 text-center">
        <div class="rounded bg-blue-600 p-6 text-lg font-semibold text-white">
            Blue Background White Text
        </div>

        <div class="rounded bg-green-600 p-6 text-lg font-semibold text-white">
            Green Background White Text
        </div>

        <div class="rounded border-2 border-red-600 bg-white p-6 text-lg">
            White Background Red Border
        </div>

        <div class="rounded border-2 border-dashed border-yellow-500 bg-yellow-100 p-6 text-lg">
            Yellow Dashed Border
        </div>

        <div class="rounded border-2 border-purple-600 bg-purple-50 p-6 text-lg text-purple-950">
            Purple Border
        </div>

        <div class="rounded-xl border border-slate-400 bg-slate-100 p-6 text-lg">
            Gray Rounded Border
        </div>
    </main>
</body>
</html>
