<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Product Card</title>
    <link rel="stylesheet" href="exercise-3-product-card.css">
</head>
<body>
    <main class="product-card">
        <div class="product-image" role="img" aria-label="Modern lamp placeholder">Lamp</div>
        <button class="favorite-button" type="button" aria-label="Add product to favorites">♥</button>
        <div class="product-content">
            <h1>Modern Lamp</h1>
            <p class="price">$199</p>
            <p class="description">Modern, timeless classic from world's best designers.</p>
            <button class="cart-button" type="button">Add to cart</button>
        </div>
    </main>
</body>
</html>
