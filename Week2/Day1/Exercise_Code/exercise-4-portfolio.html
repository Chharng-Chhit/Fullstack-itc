<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4 - Portfolio Hero</title>
    <link rel="stylesheet" href="exercise-4-portfolio.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#top">△ LOGO</a>
        <nav aria-label="Portfolio navigation">
            <ul class="nav-list">
                <li><a href="#about">About Me</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#certificates">Certificates</a></li>
            </ul>
        </nav>
        <div class="account-links">
            <a class="sign-up-link" href="#signup">Sign Up</a>
            <a class="login-link" href="#login">Login</a>
        </div>
    </header>

    <main id="top" class="hero-section">
        <section id="about" class="hero-content">
            <div class="hero-text">
                <h1>Build simple and useful digital experiences.</h1>
                <p>Frontend developer creating clean interfaces and friendly products for real people.</p>
                <div class="hero-buttons">
                    <a class="primary-button" href="#projects">Learn more</a>
                    <a class="secondary-button" href="#signup">Sign Up</a>
                </div>
            </div>
            <div class="browser-illustration" aria-label="Simple browser illustration" role="img">
                <div class="browser-bar"><span></span><span></span><span></span></div>
                <div class="illustration-card"><strong>Project card</strong><span>Simple design</span><button type="button">View</button></div>
            </div>
        </section>
    </main>
</body>
</html>
