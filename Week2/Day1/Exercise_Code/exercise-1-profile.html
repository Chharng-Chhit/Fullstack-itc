<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - Profile Card</title>
    <link rel="stylesheet" href="exercise-1-profile.css">
</head>
<body>
    <main class="profile-card">
        <div class="profile-cover" aria-label="Decorative city cover"></div>
        <div class="profile-content">
            <div class="profile-image" role="img" aria-label="Profile image placeholder">AC</div>
            <h1>Aurora Chen</h1>
            <p class="username">@auroracreates</p>
            <p class="profile-description">Digital artist and front-end developer based in Neo-Kyoto. Passionate about creating beautiful, intuitive interfaces.</p>
            <nav class="social-links" aria-label="Social links">
                <a href="#website" aria-label="Website">◎</a>
                <a href="#x" aria-label="X social profile">X</a>
                <a href="#dribbble" aria-label="Dribbble profile">◉</a>
            </nav>
        </div>
    </main>
</body>
</html>
