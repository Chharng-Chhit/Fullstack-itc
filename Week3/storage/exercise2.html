<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP08.2 - SessionStorage To-do List</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #173f68;
        border-left: 4px solid #f47b2a;
        padding: 12px 20px;
      }
      h1 {
        font-size: 46px;
        margin: 0 0 10px;
        border-bottom: 4px solid #244f79;
        padding-bottom: 5px;
      }
      h2 {
        font:
          bold 24px Consolas,
          monospace;
        margin: 12px 0;
      }
      p {
        font-size: 20px;
        line-height: 1.4;
        margin: 8px 0 35px;
      }
      .todo-box {
        max-width: 580px;
        margin: auto;
        border: 4px solid #111;
        padding: 20px 16px 40px;
        box-shadow: 0 3px 5px #888;
      }
      h3 {
        text-align: center;
        color: #111;
        margin: 0 0 16px;
      }
      .form {
        background: #ddd;
        border-radius: 13px;
        padding: 12px;
        display: flex;
        gap: 16px;
        align-items: end;
      }
      .field {
        flex: 1;
      }
      label {
        display: block;
        color: #222;
        font-size: 13px;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        min-width: 0;
        border: 0;
        border-radius: 12px;
        padding: 11px 10px;
        font-size: 14px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-weight: bold;
        cursor: pointer;
      }
      .add {
        background: #087bb9;
        color: white;
      }
      .task {
        display: grid;
        grid-template-columns: 1.35fr 1fr 1fr 28px;
        gap: 12px;
        align-items: center;
        border: 1px solid #ccc;
        border-radius: 12px;
        padding: 9px 12px;
        margin-top: 9px;
        color: #222;
        font-size: 13px;
      }
      .delete {
        background: transparent;
        color: #111;
        padding: 0;
        font-size: 22px;
      }
      @media (max-width: 700px) {
        h1 {
          font-size: 34px;
        }
        .form,
        .task {
          display: block;
        }
        .field {
          margin-bottom: 8px;
        }
        .add {
          margin-top: 4px;
        }
      }
    </style>
  </head>
  <body>
    <h1>TP08 Exercises</h1>
    <h2>TP08.2: Todo list with SessionStorage</h2>
    <p>
      Build a web application allowing user to create do-to list based on
      following UI designs and functionalities. The data must be stored inside
      <b>SessionStorage</b>
    </p>
    <section class="todo-box">
      <h3>To-do List with SessionStorage</h3>
      <div class="form">
        <div class="field">
          <label for="title">Task title</label
          ><input id="title" placeholder="Title" />
        </div>
        <div class="field">
          <label for="assignee">Assignee</label
          ><input id="assignee" placeholder="John" />
        </div>
        <div class="field">
          <label for="deadline">Dateline</label
          ><input id="deadline" type="date" />
        </div>
        <button class="add" id="add">Add</button>
      </div>
      <div id="taskList"></div>
    </section>
    <script>
      const titleInput = document.querySelector("#title"),
        assigneeInput = document.querySelector("#assignee"),
        deadlineInput = document.querySelector("#deadline"),
        taskList = document.querySelector("#taskList");
      let tasks = JSON.parse(sessionStorage.getItem("tp08Tasks")) || [];
      const removeData = (index) => {
        tasks.splice(index, 1);
        sessionStorage.setItem("tp08Tasks", JSON.stringify(tasks));
        render();
      };

      const render = () => {
        const listingHTML = tasks.map((task, index) => {
            return `
                <div class="task">
                    <span>${task.title}</span>
                    <span>${task.assignee}</span>
                    <span>${task.deadline}</span>
                    <button class="delete" onclick="removeData(${index})">🗑</button>` +
                `</div>`;
                }).join(" ");
        taskList.innerHTML = listingHTML;
      };
      
      document.querySelector("#add").onclick = function () {
        if (
          titleInput.value.trim() === "" ||
          assigneeInput.value.trim() === "" ||
          deadlineInput.value === ""
        )
          return;
        tasks.push({
          title: titleInput.value.trim(),
          assignee: assigneeInput.value.trim(),
          deadline: deadlineInput.value,
        });
        sessionStorage.setItem("tp08Tasks", JSON.stringify(tasks));
        render();
        titleInput.value = "";
        assigneeInput.value = "";
        deadlineInput.value = "";
      };
      render();
    </script>
  </body>
</html>
