<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - Sign In</title>
    <link rel="stylesheet" href="exercise-2-sign-in.css">
</head>
<body>
    <main class="sign-in-card">
        <h1>Sign In</h1>
        <p class="form-introduction">Enter your credentials to continue</p>
        <form action="#" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-options">
                <label class="remember-option" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Remember me
                </label>
                <a href="#forgot-password">Forgot password?</a>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <p class="create-account">Don't have an account? <a href="#create-account">Create one</a></p>
    </main>
</body>
</html>
