<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP08.03 - Cookie</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial;
        color: #173f68;
        border-left: 4px solid #f47b2a;
        padding: 10px 20px;
      }
      h1 {
        font-size: 46px;
        margin: 0 0 10px;
        border-bottom: 4px solid #244f79;
        padding-bottom: 5px;
      }
      h2 {
        font: 24px Consolas;
        margin: 10px 0;
      }
      p {
        font-size: 20px;
        margin: 8px 0 40px;
      }
      .manager {
        max-width: 800px;
        margin: auto;
        border: 4px solid #111;
        padding: 24px 34px 36px;
        box-shadow: 0 2px 4px #777;
      }
      h3 {
        text-align: center;
        color: #111;
        font-size: 20px;
        margin: 0 0 22px;
      }
      .form {
        background: #ddd;
        border-radius: 15px;
        padding: 15px;
        display: flex;
        gap: 22px;
        align-items: end;
      }
      label {
        display: block;
        color: #222;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 12px;
        font-size: 16px;
      }
      .field {
        flex: 1;
      }
      .date-field {
        flex: 1.1;
      }
      button {
        border: 0;
        border-radius: 14px;
        padding: 14px 25px;
        font-size: 16px;
        font-weight: bold;
        background: #087bb9;
        color: white;
        cursor: pointer;
      }
      .rows {
        margin-top: 18px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        align-items: center;
        gap: 20px;
        border: 1px solid #ccc;
        border-radius: 15px;
        padding: 8px 14px;
        margin: 10px 0;
        color: #222;
      }
      .delete {
        background: #c47474;
        padding: 10px 18px;
      }
      @media (max-width: 700px) {
        h1 {
          font-size: 34px;
        }
        .form,
        .row {
          display: block;
        }
        .field,
        .date-field {
          margin-bottom: 10px;
        }
        button {
          margin-top: 5px;
        }
      }
    </style>
  </head>
  <body>
    <h1>TP08 Exercises</h1>
    <h2>TP08.3: Cookie</h2>
    <p>
      Build a web application allowing the user to create data in a list. The
      data must be stored inside a <b>Cookie</b>.
    </p>
    <section class="manager">
      <h3>Cookie Management</h3>
      <div class="form">
        <div class="field">
          <label for="key">Key</label><input id="key" placeholder="Key" />
        </div>
        <div class="field">
          <label for="value">Value</label
          ><input id="value" placeholder="value" />
        </div>
        <div class="date-field">
          <label for="expired">Expired</label><input id="expired" type="date" />
        </div>
        <button id="add">Add</button>
      </div>
      <div id="rows" class="rows"></div>
    </section>
    <script>
      const keyInput = document.querySelector("#key"),
        valueInput = document.querySelector("#value"),
        dateInput = document.querySelector("#expired"),
        rows = document.querySelector("#rows");

      let data = [];
      document.cookie.split("; ").forEach(function (cookie) {
        const parts = cookie.split("=");
        if (parts[0].startsWith("tp08_")) {
          data.push({
            key: decodeURIComponent(parts[0].substring(5)),
            value: decodeURIComponent(parts.slice(1).join("=")),
          });
        }
      });

      const removeData = (index) => {
        const key = data[index].key;
        document.cookie = "tp08_" + encodeURIComponent(key) + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";
        data.splice(index, 1);
        render();
      };

      const render = () => {
        const listingHTML = data.map((item, index) => {
          return `<div class="row"><span>${item.key}</span><span>${item.value}</span><button class="delete" onclick="removeData(${index})">Set expired</button></div>`;
        }).join(" ");
        rows.innerHTML = listingHTML;
      };

      document.querySelector("#add").onclick = function () {
        const key = keyInput.value.trim(),
          value = valueInput.value.trim();

        if (key === "" || value === "") return;
        const expiry = dateInput.value
          ? new Date(dateInput.value + "T23:59:59")
          : new Date(Date.now() + 86400000);


        document.cookie =
          "tp08_" +
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(value) +
          "; expires=" +
          expiry.toUTCString() +
          "; path=/";
        data.push({ key: key, value: value });
        render();
        
        keyInput.value = "";
        valueInput.value = "";
      };
      render();
    </script>
  </body>
</html>
