<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 10 - Responsive Gallery</title>
    <script src="../../Day2/Code/tailwind.js"></script>
</head>
<body class="bg-slate-50 p-4 text-slate-950 sm:p-6">
    <main class="mx-auto max-w-6xl">
        <header class="mb-6">
            <p class="mb-2 text-sm font-bold uppercase tracking-wide text-blue-700">Exercise 10</p>
            <h1 class="text-3xl font-bold">Responsive Gallery</h1>
            <p class="mt-2 text-slate-600">A photo gallery that changes columns for different screen sizes.</p>
        </header>

        <section aria-labelledby="gallery-title">
            <h2 id="gallery-title" class="mb-4 text-xl font-bold">Mountain Views</h2>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
                <figure class="overflow-hidden rounded-lg bg-white shadow">
                    <img class="h-56 w-full object-cover" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain lake surrounded by green hills">
                    <figcaption class="p-3 font-semibold">Mountain Lake</figcaption>
                </figure>

                <figure class="overflow-hidden rounded-lg bg-white shadow">
                    <img class="h-56 w-full object-cover" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain peaks under a blue sky">
                    <figcaption class="p-3 font-semibold">Snowy Peaks</figcaption>
                </figure>

                <figure class="overflow-hidden rounded-lg bg-white shadow">
                    <img class="h-56 w-full object-cover" src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=80" alt="Green valley with mountains in the distance">
                    <figcaption class="p-3 font-semibold">Green Valley</figcaption>
                </figure>

                <figure class="overflow-hidden rounded-lg bg-white shadow">
                    <img class="h-56 w-full object-cover" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80" alt="Dark mountain beside a calm lake">
                    <figcaption class="p-3 font-semibold">Quiet Lake</figcaption>
                </figure>

                <figure class="overflow-hidden rounded-lg bg-white shadow">
                    <img class="h-56 w-full object-cover" src="https://images.unsplash.com/photo-1464278533981-50106e6176b1?auto=format&fit=crop&w=900&q=80" alt="Waterfall flowing through a forest valley">
                    <figcaption class="p-3 font-semibold">Forest Waterfall</figcaption>
                </figure>

                <figure class="overflow-hidden rounded-lg bg-white shadow">
                    <img class="h-56 w-full object-cover" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain road leading toward a blue lake">
                    <figcaption class="p-3 font-semibold">Mountain Road</figcaption>
                </figure>
            </div>
        </section>
    </main>
</body>
</html>
