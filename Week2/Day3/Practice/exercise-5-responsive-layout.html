<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5 - Responsive Layout</title>
    <script src="../../Day2/Code/tailwind.js"></script>
</head>
<body class="bg-white p-8 text-slate-950">
    <main class="grid max-w-5xl gap-6 md:grid-cols-3">
        <section>
            <p class="mb-3 text-center text-sm font-bold text-green-700">Desktop (&ge; 1024px)</p>
            <div class="grid grid-cols-3 gap-2 text-center text-sm">
                <div class="col-span-3 rounded bg-purple-600 p-4 text-white">Header</div>
                <div class="rounded bg-purple-100 p-10">Sidebar</div>
                <div class="col-span-2 rounded bg-slate-100 p-10">Content</div>
            </div>
        </section>

        <section>
            <p class="mb-3 text-center text-sm font-bold text-orange-600">Tablet (&ge; 768px)</p>
            <div class="grid grid-cols-2 gap-2 text-center text-sm">
                <div class="col-span-2 rounded bg-purple-600 p-4 text-white">Header</div>
                <div class="rounded bg-purple-100 p-10">Sidebar</div>
                <div class="rounded bg-slate-100 p-10">Content</div>
            </div>
        </section>

        <section>
            <p class="mb-3 text-center text-sm font-bold text-blue-700">Mobile (&lt; 768px)</p>
            <div class="grid gap-2 text-center text-sm">
                <div class="rounded bg-purple-600 p-4 text-white">Header</div>
                <div class="rounded bg-purple-100 p-5">Sidebar</div>
                <div class="rounded bg-slate-100 p-8">Content</div>
            </div>
        </section>
    </main>
</body>
</html>
