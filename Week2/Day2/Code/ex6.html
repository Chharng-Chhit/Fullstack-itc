<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent {
        width: 90%;
        margin: auto;
        padding: 30px 0;
        /* border: 1px solid black; */
        display: grid;
    
        grid-template-columns: repeat(1fr, 3);


        grid-template-areas: 
            'child1 child1 child1'
            'child2 child3 child4'
            'child2 child5 child5'
            'child6 child6 child6'
        ;
    }

    .child {
        border: 1px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 50px;
    }

    .c1 {
        grid-area: child1;
    }

    .c2 {
        grid-area: child2;
    }
    .c3 {
        grid-area: child3;
    }
    .c4 {
        grid-area: child4;
    }
    .c5 {
        grid-area: child5;
    }
    .c6 {
        grid-area: child6;
    }

    @media only screen and (max-width: 600px){
        .parent {
            grid-template-columns: 1fr 1fr;
            grid-template-areas: 
                'child1 child1'
                'child2 child2'
                'child3 child4'
                'child5 child5'
                'child6 child6'
            ;
        }
    }
</style>
<body>
    <div class="parent">
        <div class="child c1">1</div>
        <div class="child c2">2</div>
        <div class="child c3">3</div>
        <div class="child c4">4</div>
        <div class="child c5">5</div>
        <div class="child c6">6</div>
    </div>
</body>
</html>
