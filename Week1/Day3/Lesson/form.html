<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h1>Product Information</h1>

        <!-- Product name -->
        <label for="name">Product Name</label> <br>
        <input type="text" placeholder="Enter product name" name="product" required> <br><br>

        <!-- Product Code -->
        <label for="code">Product Code</label> <br>
        <input type="text" name="code" placeholder="Example: PRD-001" size="10"><br><br>

        <!-- Price -->
        <label for="price">Price</label> <br>
        <input type="number" name="price">

        <br><br>
        <label for="category">Category</label> <br>
        <select name="category" id="">
            <option value="">-- Select Category --</option>
            <option value="electronics">Electronics</option>
        </select>

        <br> <br>
        <textarea name="description" id="" rows="5" cols="50"></textarea><br>
        <button type="submit">Save</button>

    </form>
</body>
</html>
